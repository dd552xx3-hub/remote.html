name: Build TV Remote APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Android Project Files
        run: |
          mkdir -p app/src/main/java/com/tvremote/box
          mkdir -p app/src/main/res/xml

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TVRemoteBox"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.1.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.0' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.tvremote.box'
              compileSdk 34
              defaultConfig {
                  applicationId "com.tvremote.box"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              packagingOptions {
                  resources {
                      excludes += ['META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties']
                  }
              }
          }
          dependencies {
              implementation 'com.hivemq:hivemq-mqtt-client:1.3.3'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.tvremote.box">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <application
                  android:label="TV Cloud Remote"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".RemoteService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true" />
          EOF

          cat << 'EOF' > app/src/main/java/com/tvremote/box/MainActivity.kt
          package com.tvremote.box
          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Toast

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  Toast.makeText(this, "Hãy vào Trợ năng (Accessibility) -> Bật TV Cloud Remote", Toast.LENGTH_LONG).show()
                  startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  finish()
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/tvremote/box/RemoteService.kt
          package com.tvremote.box
          import android.accessibilityservice.AccessibilityService
          import android.content.Context
          import android.content.Intent
          import android.media.AudioManager
          import android.net.Uri
          import android.os.Handler
          import android.os.Looper
          import android.view.accessibility.AccessibilityEvent
          import android.widget.Toast
          import com.hivemq.client.mqtt.MqttClient
          import com.hivemq.client.mqtt.mqtt3.Mqtt3AsyncClient
          import org.json.JSONObject
          import java.nio.charset.StandardCharsets
          import java.util.UUID

          class RemoteService : AccessibilityService() {
              private var mqttClient: Mqtt3AsyncClient? = null
              private val TOPIC = "hunonic_replace/dat_tv360_secret_2026/cmd"

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  showToast("Đã bật dịch vụ điều khiển TV từ xa!")
                  connectMqtt()
              }

              private fun connectMqtt() {
                  mqttClient = MqttClient.builder()
                      .useMqttVersion3()
                      .identifier("ViettelBox-" + UUID.randomUUID().toString())
                      .serverHost("broker.hivemq.com")
                      .serverPort(1883)
                      .automaticReconnectWithDefaultConfig()
                      .buildAsync()

                  mqttClient?.connect()?.whenComplete { _, throwable ->
                      if (throwable == null) {
                          showToast("Đã kết nối Cloud MQTT!")
                          mqttClient?.subscribeWith()
                              ?.topicFilter(TOPIC)
                              ?.callback { publish ->
                                  val payload = String(publish.payloadAsBytes, StandardCharsets.UTF_8)
                                  handleCommand(payload)
                              }
                              ?.send()
                      }
                  }
              }

              private fun handleCommand(jsonStr: String) {
                  try {
                      val json = JSONObject(jsonStr)
                      if (json.optString("type") == "URL") {
                          val url = json.optString("url")
                          if (url.isNotEmpty()) {
                              val intent = Intent(Intent.ACTION_VIEW, Uri.parse(url)).apply {
                                  addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              }
                              startActivity(intent)
                          }
                          return
                      }
                      val cmd = json.optString("cmd")
                      val audio = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                      when (cmd) {
                          "HOME" -> performGlobalAction(GLOBAL_ACTION_HOME)
                          "BACK" -> performGlobalAction(GLOBAL_ACTION_BACK)
                          "POWER" -> performGlobalAction(GLOBAL_ACTION_LOCK_SCREEN)
                          "VOL_UP" -> audio.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_RAISE, AudioManager.FLAG_SHOW_UI)
                          "VOL_DOWN" -> audio.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_LOWER, AudioManager.FLAG_SHOW_UI)
                          "MUTE" -> audio.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_TOGGLE_MUTE, AudioManager.FLAG_SHOW_UI)
                          "YOUTUBE" -> {
                              val intent = packageManager.getLaunchIntentForPackage("com.google.android.youtube.tv")
                                  ?: Intent(Intent.ACTION_VIEW, Uri.parse("https://www.youtube.com"))
                              intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              startActivity(intent)
                          }
                          "UP" -> execKey(19)
                          "DOWN" -> execKey(20)
                          "LEFT" -> execKey(21)
                          "RIGHT" -> execKey(22)
                          "OK" -> execKey(23)
                          "CH_UP" -> execKey(166)
                          "CH_DOWN" -> execKey(167)
                      }
                  } catch (_: Exception) {}
              }

              private fun execKey(keyCode: Int) {
                  Thread {
                      try { Runtime.getRuntime().exec("input keyevent $keyCode") } catch (_: Exception) {}
                  }.start()
              }

              private fun showToast(msg: String) {
                  Handler(Looper.getMainLooper()).post {
                      Toast.makeText(applicationContext, msg, Toast.LENGTH_SHORT).show()
                  }
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ViettelBox-Remote-APK
          path: app/build/outputs/apk/debug/app-debug.apk
